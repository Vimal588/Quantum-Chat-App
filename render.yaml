services:
  # ============================================================================
  # 1. Spring Boot Backend Web Service (Docker)
  # ============================================================================
  - type: web
    name: quantum-chat-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: quantum-chat-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: quantum-chat-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: quantum-chat-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: quantum-chat-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: quantum-chat-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: '*'

  # ============================================================================
  # 2. React Frontend (Static Site with SPA Client Routing)
  # ============================================================================
  - type: web
    name: quantum-chat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://quantum-chat-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://quantum-chat-backend.onrender.com/ws

# ==============================================================================
# 3. PostgreSQL Database
# ==============================================================================
databases:
  - name: quantum-chat-db
    databaseName: quantum_chat_db
    user: quantum_user
    plan: free
    region: oregon
